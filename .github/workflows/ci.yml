name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: packages resolve each other through their published
      # `exports`, so sibling types do not exist until dist does.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm test
      # Proves the plugins survive a real Astro build, not just markdownToHtml.
      - run: pnpm test:e2e
