name: Deploy example site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify the example site
        run: pnpm test:e2e
        env:
          SITE: https://ashish-codejourney.github.io
          BASE: /satteri-plugins
      # test:e2e builds the site several times over — once per maths renderer and
      # once under a throwaway base path — so whatever it leaves in dist/ is the
      # last variant it happened to check, not the site we mean to publish.
      # Build the real one here, after verification and immediately before upload.
      - name: Build the site that gets deployed
        run: pnpm --filter @satteri-plugins/example-astro7-site build
        env:
          SITE: https://ashish-codejourney.github.io
          BASE: /satteri-plugins
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/astro7-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
